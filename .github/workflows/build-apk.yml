name: Build WRS GEMPA APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/build-apk.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: wrs-gempa-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout canonical Android source
        uses: actions/checkout@v4
        with:
          repository: ilham8171/wrs-gempa-app
          ref: main
          path: android
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Record APK source version
        working-directory: android
        run: |
          git rev-parse HEAD
          grep -E 'versionCode|versionName' app/build.gradle.kts

      - name: Run unit tests
        working-directory: android
        run: gradle testDebugUnitTest

      - name: Run Android lint (report only)
        working-directory: android
        run: gradle lintDebug
        continue-on-error: true

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug

      - name: Verify APK
        working-directory: android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SIZE_BYTES="$(stat -c '%s' "$APK")"
          MAX_BYTES=$((500 * 1024 * 1024))
          if [ "$SIZE_BYTES" -gt "$MAX_BYTES" ]; then
            echo "APK exceeds the 500 MiB limit."
            exit 1
          fi
          echo "APK size: $((SIZE_BYTES / 1024 / 1024)) MiB"
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: wrs-gempa-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
