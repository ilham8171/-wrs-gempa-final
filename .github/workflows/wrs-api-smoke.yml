name: WRS API smoke test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "functions/api/earthquakes.js"
      - "app.js"
      - "index.html"
      - "sw.js"
      - "workers/push-cron.js"
      - "workers/earthquake-stream.js"
      - ".github/workflows/wrs-api-smoke.yml"
  push:
    branches: [main]
    paths:
      - "functions/api/earthquakes.js"
      - "app.js"
      - "workers/push-cron.js"
      - "workers/earthquake-stream.js"
      - ".github/workflows/wrs-api-smoke.yml"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: wrs-api-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          cp functions/api/earthquakes.js /tmp/earthquakes.mjs
          cp workers/push-cron.js /tmp/push-cron.mjs
          cp workers/earthquake-stream.js /tmp/earthquake-stream.mjs
          node --check /tmp/earthquakes.mjs
          node --check /tmp/push-cron.mjs
          node --check /tmp/earthquake-stream.mjs

      - name: Check production API contract
        env:
          API_URL: https://wrs-gempa-final.pages.dev/api/earthquakes
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.API_URL + "?smoke=" + Date.now();
          const response = await fetch(url, {
            headers: { accept: "application/json", "cache-control": "no-cache" },
            signal: AbortSignal.timeout(25000)
          });
          if (!response.ok) throw new Error("Earthquake API HTTP " + response.status);
          const data = await response.json();
          if (data?.ok !== true) throw new Error("API did not return ok=true");
          if (!Array.isArray(data.recent)) throw new Error("recent must be an array");
          if (!Array.isArray(data.realtimeEvents)) throw new Error("realtimeEvents must be an array");
          if (!Array.isArray(data.tsunamiHistory)) throw new Error("tsunamiHistory must be an array");
          if (!data.sources || typeof data.sources !== "object") throw new Error("Source health summary is missing");
          console.log("API refreshSeconds=" + String(data.refreshSeconds) + " fetchedAt=" + String(data.fetchedAt));
          // The production API and client are intentionally aligned at 15 seconds
          // to reduce duplicate catalogue work and protect the Cloudflare CPU budget.
          if (!Number.isFinite(Number(data.refreshSeconds)) || Number(data.refreshSeconds) > 15 || Number(data.refreshSeconds) < 5) {
            throw new Error("API refresh interval must be between 5 and 15 seconds; received " + String(data.refreshSeconds));
          }
          if (!data.sources?.wrs || typeof data.sources.wrs.ok !== "boolean") {
            throw new Error("WRS health status is missing");
          }
          if (data.realtime != null) {
            if (data.realtime.source !== "InaTEWS WRS" || data.realtime.wrsRealtime !== true) {
              throw new Error("realtime is not from the dedicated live WRS feed");
            }
          }
          for (const event of data.realtimeEvents) {
            if (event?.source !== "InaTEWS WRS" || event?.wrsRealtime !== true) {
              throw new Error("realtimeEvents contains a historical or non-WRS event");
            }
          }
          for (const item of data.tsunamiHistory) {
            if (item?.isTsunamiWarning !== true || !item?.source) {
              throw new Error("tsunamiHistory contains an event without official warning/source labels");
            }
            if (item.sshBounds != null) {
              const b = item.sshBounds;
              if (![b.minLat,b.minLon,b.maxLat,b.maxLon].every(v => Number.isFinite(Number(v)))) {
                throw new Error("SSHmax bounds are incomplete");
              }
              if (!(Number(b.minLat) < Number(b.maxLat) && Number(b.minLon) < Number(b.maxLon))) {
                throw new Error("SSHmax bounds are invalid");
              }
            }
          }
          console.log(JSON.stringify({
            ok: data.ok,
            recentCount: data.recent.length,
            realtimeCount: data.realtimeEvents.length,
            tsunamiBulletinCount: data.tsunamiHistory.length,
            wrsConnected: data.sources.wrs.ok,
            upstreamErrors: data.sources.errors || []
          }, null, 2));
          NODE

      - name: Check production SSE stream health and handshake
        env:
          STREAM_BASE_URL: https://wrs-gempa-stream.sansat6t5655.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.STREAM_BASE_URL;
          const healthResponse = await fetch(base + "/health", {
            headers: { accept: "application/json", "cache-control": "no-cache" },
            signal: AbortSignal.timeout(10000)
          });
          if (!healthResponse.ok) throw new Error("SSE health HTTP " + healthResponse.status);
          const health = await healthResponse.json();
          if (health?.ok !== true) throw new Error("SSE health did not return ok=true");
          if (Number(health.pollIntervalMs) !== 15000) {
            throw new Error("Unexpected SSE poll interval: " + String(health.pollIntervalMs));
          }
          if (!Number.isInteger(health.activeClients) || health.activeClients < 0) {
            throw new Error("SSE health activeClients is invalid");
          }
          console.log("SSE health " + JSON.stringify({
            ok: health.ok,
            activeClients: health.activeClients,
            pollIntervalMs: health.pollIntervalMs,
            lastPollAt: health.lastPollAt,
            lastSuccessfulPollAt: health.lastSuccessfulPollAt,
            version: health.version
          }));

          const controller = new AbortController();
          const response = await fetch(base + "/events", {
            headers: { accept: "text/event-stream", "cache-control": "no-cache" },
            signal: controller.signal
          });
          if (!response.ok) throw new Error("SSE events HTTP " + response.status);
          if (!String(response.headers.get("content-type") || "").includes("text/event-stream")) {
            throw new Error("SSE endpoint returned the wrong content type");
          }
          if (!response.body) throw new Error("SSE response body is missing");
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let text = "";
          const deadline = Date.now() + 5000;
          try {
            while (!text.includes("event: ready") && Date.now() < deadline) {
              const part = await Promise.race([
                reader.read(),
                new Promise((_, reject) => setTimeout(() => reject(new Error("Timed out waiting for SSE ready frame")), Math.max(1, deadline - Date.now())))
              ]);
              if (part.done) break;
              text += decoder.decode(part.value, { stream: true });
            }
          } finally {
            try { await reader.cancel(); } catch {}
          }
          if (!text.includes("event: ready")) {
            throw new Error("SSE stream did not send its initial ready event");
          }
          console.log("SSE handshake passed");
          NODE
