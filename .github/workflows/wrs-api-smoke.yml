name: WRS API smoke test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "functions/api/earthquakes.js"
      - "functions/api/push-feed.js"
      - "app.js"
      - "index.html"
      - "styles.css"
      - "sw.js"
      - "workers/push-cron.js"
      - "workers/earthquake-stream.js"
      - ".github/workflows/wrs-api-smoke.yml"
  push:
    branches: [main]
    paths:
      - "functions/api/earthquakes.js"
      - "functions/api/push-feed.js"
      - "app.js"
      - "index.html"
      - "styles.css"
      - "sw.js"
      - "workers/push-cron.js"
      - "workers/earthquake-stream.js"
      - ".github/workflows/wrs-api-smoke.yml"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: wrs-api-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          cp functions/api/earthquakes.js /tmp/earthquakes.mjs
          cp functions/api/push-feed.js /tmp/push-feed.mjs
          cp workers/push-cron.js /tmp/push-cron.mjs
          cp workers/earthquake-stream.js /tmp/earthquake-stream.mjs
          node --check /tmp/earthquakes.mjs
          node --check /tmp/push-feed.mjs
          node --check /tmp/push-cron.mjs
          node --check /tmp/earthquake-stream.mjs

      - name: Check compact alert, tsunami priority, and cache contracts
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const [app, html, css, sw, pushWorker, pushFeed] = await Promise.all([
            readFile("app.js", "utf8"),
            readFile("index.html", "utf8"),
            readFile("styles.css", "utf8"),
            readFile("sw.js", "utf8"),
            readFile("workers/push-cron.js", "utf8"),
            readFile("functions/api/push-feed.js", "utf8")
          ]);
          const failures = [];
          const check = (ok, message) => { if (!ok) failures.push(message); };

          check(html.includes('id="wrsEventPopupOverlay"') &&
                html.includes('id="wrsEventPopupClose"') &&
                html.includes('id="wrsEventPopupDetails"'),
                "Compact event popup markup/close/detail controls are missing.");
          check(css.includes(".wrs-event-popup-card") &&
                css.includes("max-height: min(68vh, 560px)") &&
                css.includes(".wrs-event-popup-overlay.hidden"),
                "Compact popup CSS must remain constrained and dismissible.");
          check(app.includes("function showCompactEventPopup(q, kind)") &&
                app.includes("function closeCompactEventPopup()"),
                "Compact popup renderer/closer is missing.");
          check(app.includes('capStatus !== "actual"') &&
                app.includes('["alert", "update"].includes(msgType)') &&
                app.includes("expiresAt <= now"),
                "Tsunami popups must require current official CAP status and expiry.");
          check(app.includes("function latestVerifiedActiveTsunamiWarning()") &&
                app.includes("latestByBulletin"),
                "Tsunami updates/cancellations must supersede older bulletin records.");
          check(app.includes("function showInitialEventPopup()") &&
                app.includes("showCompactEventPopup(tsunami, \"tsunami\")") &&
                app.includes("showCompactEventPopup(felt, \"felt\")"),
                "First-open popup must use compact tsunami/felt cards.");
          const processStart = app.indexOf("function processNew()");
          const statusStart = app.indexOf("\nfunction status(", processStart);
          const processBody = processStart >= 0 && statusStart > processStart
            ? app.slice(processStart, statusStart) : "";
          check(processBody && !processBody.includes("openTsunamiModal(q)"),
                "New events must not force a full-screen tsunami modal.");
          check(app.includes('params.get("quake") || params.get("event")'),
                "Deep links using either quake= or event= must resolve.");
          check(app.includes("quake-detail-star") &&
                css.includes("@keyframes wrsDetailStarPulse") &&
                css.includes("@keyframes wrsDetailStarRing"),
                "Detail map should show a low-cost pulsing epicentre star.");
          check(pushWorker.includes("summary/all_day.geojson") &&
                pushWorker.includes("if (magnitude < 5.0) return null;") &&
                pushFeed.includes("USGS supplements BMKG/InaTEWS globally at M5.0+, including Indonesia."),
                "USGS push threshold must be M5+ worldwide and use a broad-enough one-day feed.");
          check(pushWorker.includes("function fetchApiCatalogFallback(now)") &&
                pushWorker.includes("apiFallback: fallbackDiagnostics") &&
                pushWorker.includes("return isIndonesia(q) ? magnitude >= 3.0 : magnitude >= 5.0;"),
                "Push worker must fall back to the normalized API and log eligibility diagnostics.");
          check(pushWorker.includes('["alert", "update", "cancel"].includes(msgType)') &&
                pushWorker.includes("cap_sent:String(item.capSent||item.timesent||") &&
                pushWorker.includes("PERINGATAN TSUNAMI BERAKHIR/DICABUT"),
                "Push worker must forward every distinct official tsunami CAP update through cancellation.");
          const appScript = html.match(/<script src="([^"]*app.js[^"]*)"/)?.[1] || "";
          const cssLink = html.match(/<link rel="stylesheet" href="([^"]*styles.css[^"]*)"/)?.[1] || "";
          check(appScript.length > 0 && sw.includes('"' + appScript + '"'),
                "Service worker shell must cache the current app.js URL.");
          check(cssLink.length > 0 && sw.includes('"' + cssLink + '"'),
                "Service worker shell must cache the current stylesheet URL.");
          if (failures.length) {
            console.error(failures.map((failure, i) => (i + 1) + ". " + failure).join("\n"));
            process.exitCode = 1;
          } else {
            console.log("Compact popup, live push fallback, M3/M5 thresholds, tsunami CAP revisions, event links, pulsing star, and cache contracts passed.");
          }
          NODE

      - name: Check production API contract
        env:
          API_URL: https://wrs-gempa-final.pages.dev/api/earthquakes
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.API_URL + "?smoke=" + Date.now();
          const response = await fetch(url, {
            headers: { accept: "application/json", "cache-control": "no-cache" },
            signal: AbortSignal.timeout(25000)
          });
          if (!response.ok) throw new Error("Earthquake API HTTP " + response.status);
          const data = await response.json();
          if (data?.ok !== true) throw new Error("API did not return ok=true");
          if (!Array.isArray(data.recent)) throw new Error("recent must be an array");
          if (!Array.isArray(data.realtimeEvents)) throw new Error("realtimeEvents must be an array");
          if (!Array.isArray(data.tsunamiHistory)) throw new Error("tsunamiHistory must be an array");
          if (!data.sources || typeof data.sources !== "object") throw new Error("Source health summary is missing");
          console.log("API refreshSeconds=" + String(data.refreshSeconds) + " fetchedAt=" + String(data.fetchedAt));
          // The production API and client are intentionally aligned at 15 seconds
          // to reduce duplicate catalogue work and protect the Cloudflare CPU budget.
          if (!Number.isFinite(Number(data.refreshSeconds)) || Number(data.refreshSeconds) > 15 || Number(data.refreshSeconds) < 5) {
            throw new Error("API refresh interval must be between 5 and 15 seconds; received " + String(data.refreshSeconds));
          }
          if (!data.sources?.wrs || typeof data.sources.wrs.ok !== "boolean") {
            throw new Error("WRS health status is missing");
          }
          if (data.realtime != null) {
            if (data.realtime.source !== "InaTEWS WRS" || data.realtime.wrsRealtime !== true) {
              throw new Error("realtime is not from the dedicated live WRS feed");
            }
          }
          for (const event of data.realtimeEvents) {
            if (event?.source !== "InaTEWS WRS" || event?.wrsRealtime !== true) {
              throw new Error("realtimeEvents contains a historical or non-WRS event");
            }
          }
          for (const item of data.tsunamiHistory) {
            if (item?.isTsunamiWarning !== true || !item?.source) {
              throw new Error("tsunamiHistory contains an event without official warning/source labels");
            }
            if (item.sshBounds != null) {
              const b = item.sshBounds;
              if (![b.minLat,b.minLon,b.maxLat,b.maxLon].every(v => Number.isFinite(Number(v)))) {
                throw new Error("SSHmax bounds are incomplete");
              }
              if (!(Number(b.minLat) < Number(b.maxLat) && Number(b.minLon) < Number(b.maxLon))) {
                throw new Error("SSHmax bounds are invalid");
              }
            }
          }
          console.log(JSON.stringify({
            ok: data.ok,
            recentCount: data.recent.length,
            realtimeCount: data.realtimeEvents.length,
            tsunamiBulletinCount: data.tsunamiHistory.length,
            wrsConnected: data.sources.wrs.ok,
            upstreamErrors: data.sources.errors || []
          }, null, 2));
          NODE

      - name: Check production SSE health, handshake, and live API polling
        env:
          STREAM_BASE_URL: https://wrs-gempa-stream.sansat6t5655.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.STREAM_BASE_URL;
          async function getHealth() {
            const response = await fetch(base + "/health", {
              headers: { accept: "application/json", "cache-control": "no-cache" },
              signal: AbortSignal.timeout(8000)
            });
            if (!response.ok) throw new Error("SSE health HTTP " + response.status);
            const data = await response.json();
            if (data?.ok !== true) throw new Error("SSE health did not return ok=true");
            if (Number(data.pollIntervalMs) !== 15000) {
              throw new Error("Unexpected SSE poll interval: " + String(data.pollIntervalMs));
            }
            if (!Number.isInteger(data.activeClients) || data.activeClients < 0) {
              throw new Error("SSE health activeClients is invalid");
            }
            return data;
          }

          const baseline = await getHealth();
          const baselinePollAt = baseline.lastSuccessfulPollAt || null;
          const controller = new AbortController();
          const response = await fetch(base + "/events", {
            headers: { accept: "text/event-stream", "cache-control": "no-cache" },
            signal: controller.signal
          });
          if (!response.ok) throw new Error("SSE events HTTP " + response.status);
          if (!String(response.headers.get("content-type") || "").includes("text/event-stream")) {
            throw new Error("SSE endpoint returned the wrong content type");
          }
          if (!response.body) throw new Error("SSE response body is missing");

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let frameText = "";
          const handshakeTimer = setTimeout(() => controller.abort(), 5000);
          try {
            while (!frameText.includes("event: ready")) {
              const part = await reader.read();
              if (part.done) break;
              frameText += decoder.decode(part.value, { stream: true });
            }
          } finally {
            clearTimeout(handshakeTimer);
          }
          if (!frameText.includes("event: ready")) {
            try { await reader.cancel(); } catch {}
            throw new Error("SSE stream did not send its initial ready event");
          }

          // Keep at least one SSE client connected until the Durable Object has
          // performed a fresh API poll. This verifies the active stream/alarm path,
          // not just the HTTP handshake.
          const deadline = Date.now() + 20000;
          let polledHealth = null;
          try {
            while (Date.now() < deadline) {
              const health = await getHealth();
              const activeClient = health.activeClients >= 1;
              const latestPollAt = health.lastSuccessfulPollAt || null;
              if (activeClient && latestPollAt && latestPollAt !== baselinePollAt) {
                polledHealth = health;
                break;
              }
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
          } finally {
            try { await reader.cancel(); } catch {}
          }
          if (!polledHealth) {
            throw new Error("SSE connected, but the Durable Object did not complete a fresh API poll within 20 seconds");
          }
          console.log("SSE live poll passed " + JSON.stringify({
            activeClients: polledHealth.activeClients,
            pollIntervalMs: polledHealth.pollIntervalMs,
            lastSuccessfulPollAt: polledHealth.lastSuccessfulPollAt,
            version: polledHealth.version
          }));
          console.log("SSE handshake passed");
          NODE
